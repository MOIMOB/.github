name: MOIMOB setup
description: Install tools from the repo's mise.toml and run npm ci. Use in custom jobs next to the shared CI workflow.

inputs:
  mise-tools:
    description: Tools to install from mise.toml (space-separated). Empty = all.
    default: node
  npm-ci:
    description: Run npm ci.
    default: 'true'

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v2
      with:
        install_args: ${{ inputs.mise-tools }}
    - if: inputs.npm-ci == 'true'
      shell: bash
      run: npm ci
